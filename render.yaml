services:
  - type: web
    name: pirate-wars-bot
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_HEAVY
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_BASIC
        value: gemma-4-26b-a4b-it
      - key: GEMINI_MODEL_FAST
        value: gemma-4-26b-a4b-it
      - key: GEMINI_MODEL_REASONING
        value: gemini-3.5-flash-lite
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: pirate_wars
      - key: USE_MOCK_DB
        value: false
